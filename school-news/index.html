<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校园新闻日报 - 报告汇总</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');

:root {
  --bg: #0a0e1a;
  --bg-elev: #111726;
  --card: rgba(20, 28, 48, 0.6);
  --card-solid: rgba(20, 28, 48, 0.9);
  --border: rgba(0, 212, 255, 0.12);
  --border-hover: rgba(0, 212, 255, 0.4);
  --text: #e8eef5;
  --text-dim: #d0dae8;
  --text-faint: #c8d3e6;
  --accent: #00d4ff;
  --accent-warm: #ffb347;
  --accent-green: #22d3a0;
  --accent-purple: #818cf8;
  --accent-pink: #f87171;
  --accent-teal: #14b8a6;
  --accent-orange: #fb923c;
  --grid-line: rgba(0, 212, 255, 0.04);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Noto Sans SC', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

body::after {
  content: '';
  position: fixed;
  top: -50%; left: -20%;
  width: 80%; height: 80%;
  background: radial-gradient(ellipse at center, rgba(0, 212, 255, 0.06) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
  animation: drift 20s ease-in-out infinite alternate;
}

@keyframes drift {
  0% { transform: translate(0, 0); }
  100% { transform: translate(20%, 10%); }
}

.container {
  max-width: 800px;
  margin: 0 auto;
  padding: 0 24px 60px;
  position: relative;
  z-index: 1;
}

/* HEADER */
.hero {
  padding: 56px 24px 40px;
  text-align: center;
  border-radius: 0 0 32px 32px;
  background: linear-gradient(135deg, rgba(0,212,255,0.05) 0%, rgba(34,211,160,0.05) 100%);
  border-bottom: 1px solid var(--border);
  position: relative;
  overflow: hidden;
}

.hero-tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem;
  color: var(--accent);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
}

.hero-tag .status-dot {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--accent-green);
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(34, 211, 160, 0.4); }
  50% { opacity: 0.8; box-shadow: 0 0 0 6px rgba(34, 211, 160, 0); }
}

.hero h1 {
  font-size: 2rem;
  font-weight: 800;
  letter-spacing: -1px;
  margin-bottom: 10px;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-green) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.hero .subtitle {
  font-size: 0.95rem;
  color: var(--text-dim);
  margin-bottom: 16px;
}

.hero .update-time {
  display: inline-block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.78rem;
  color: var(--accent-warm);
  background: rgba(255, 179, 71, 0.1);
  border: 1px solid rgba(255, 179, 71, 0.2);
  padding: 4px 14px;
  border-radius: 50px;
}

/* STATS */
.stats {
  display: flex;
  justify-content: center;
  gap: 32px;
  margin-top: 24px;
  flex-wrap: wrap;
}

.stat { text-align: center; }
.stat-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--accent);
}
.stat-label {
  font-size: 0.72rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 1px;
}

/* SECTION */
.section { padding: 32px 0; }

.section-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.72rem;
  color: var(--accent);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.section-label::before { content: '## '; color: var(--text-faint); }
.section-title {
  font-size: 1.3rem;
  font-weight: 700;
  letter-spacing: -0.5px;
  margin-bottom: 20px;
}

/* REPORT CARDS */
.report-list { display: flex; flex-direction: column; gap: 12px; }

.report-card {
  display: flex;
  align-items: center;
  text-decoration: none;
  color: inherit;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px 22px;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  backdrop-filter: blur(10px);
  position: relative;
  overflow: hidden;
  gap: 12px;
}

.report-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--accent-green));
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.4s ease;
}

.report-card:hover {
  border-color: var(--border-hover);
  transform: translateY(-2px);
  box-shadow: 0 8px 32px rgba(0, 212, 255, 0.08);
}

.report-card:hover::before { transform: scaleX(1); }

.report-card .card-date {
  font-family: 'JetBrains Mono', monospace;
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 4px;
  flex-shrink: 0;
}

.report-card .card-weekday {
  font-size: 0.8rem;
  color: var(--text-dim);
  margin-bottom: 8px;
}


.card-info { flex: 1; min-width: 0; }

.report-card .card-link {
  display: flex;
  align-items: center;
  gap: 4px;
  color: var(--accent);
  font-size: 0.85rem;
  font-weight: 600;
  margin-left: auto;
  flex-shrink: 0;
  padding-left: 16px;
}

.report-card .latest-badge {
  display: inline-block;
  background: rgba(34, 211, 160, 0.15);
  color: var(--accent-green);
  font-size: 0.7rem;
  padding: 2px 10px;
  border-radius: 50px;
  font-weight: 600;
  margin-left: 8px;
  font-family: 'JetBrains Mono', monospace;
}

/* BACK LINK */
.back-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--accent);
  text-decoration: none;
  font-size: 0.85rem;
  font-weight: 500;
  margin-bottom: 20px;
  transition: gap 0.2s;
}
.back-link:hover { gap: 10px; }

/* COMMENTS */
.comments-section {
  margin-top: 40px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 28px 24px;
  backdrop-filter: blur(10px);
}
.comments-title {
  font-size: 1.1rem;
  font-weight: 700;
  margin-bottom: 6px;
}
.comments-desc {
  font-size: 0.82rem;
  color: var(--text);
  margin-bottom: 20px;
}

/* FOOTER */
.footer { padding: 32px 0; text-align: center; border-top: 1px solid var(--border); margin-top: 40px; }
.footer p { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--text-dim); }
.footer-links { display: flex; justify-content: center; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
.footer-links a { color: var(--text-dim); text-decoration: none; font-size: 0.82rem; transition: color 0.2s; }
.footer-links a:hover { color: var(--accent); }

@media (max-width: 768px) {
  .hero h1 { font-size: 1.5rem; }
  .stats { gap: 20px; }
  .stat-num { font-size: 1.3rem; }
}
</style>
