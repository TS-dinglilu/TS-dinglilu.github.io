<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<meta name="description" content="科研院所招聘日报 - 每日自动更新报告汇总">
<title>科研院所招聘日报 - 报告汇总</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');

:root {
  --bg: #0a0e1a;
  --bg-elev: #111726;
  --card: rgba(20, 28, 48, 0.6);
  --card-solid: rgba(20, 28, 48, 0.9);
  --border: rgba(0, 212, 255, 0.12);
  --border-hover: rgba(0, 212, 255, 0.4);
  --text: #f0f4f8;
  --text-dim: #c8d4e8;
  --text-faint: #90a0c0;
  --accent: #00d4ff;
  --accent-warm: #ffb347;
  --accent-green: #22d3a0;
  --accent-purple: #818cf8;
  --accent-pink: #f87171;
  --accent-teal: #14b8a6;
  --accent-orange: #fb923c;
  --grid-line: rgba(0, 212, 255, 0.04);
  --radius: 16px;
  --radius-sm: 10px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Noto Sans SC', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  overflow-x: hidden;
  min-height: 100vh;
  position: relative;
}

::selection { background: rgba(0, 212, 255, 0.25); color: #ffffff; }

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 48px 48px;
  pointer-events: none;
  z-index: 0;
  opacity: 0.6;
}

body::after {
  content: '';
  position: fixed;
  top: -20%;
  right: -10%;
  width: 600px;
  height: 600px;
  background: radial-gradient(circle, rgba(0, 212, 255, 0.08) 0%, transparent 70%);
  border-radius: 50%;
  pointer-events: none;
  z-index: 0;
  filter: blur(40px);
  animation: floatOrb 18s ease-in-out infinite;
}

@keyframes floatOrb {
  0%, 100% { transform: translate(0, 0); opacity: 0.6; }
  50% { transform: translate(-40px, 30px); opacity: 0.9; }
}

.container {
  max-width: 800px;
  margin: 0 auto;
  padding: 0 24px 60px;
  position: relative;
  z-index: 1;
}

.hero {
  padding: 56px 24px 40px;
  text-align: center;
  border-radius: 0 0 32px 32px;
  background: linear-gradient(135deg, rgba(0,212,255,0.05) 0%, rgba(34,211,160,0.05) 100%);
  border-bottom: 1px solid var(--border);
  position: relative;
  overflow: hidden;
}

.hero-tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem;
  color: var(--accent);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
}

.hero-tag .status-dot {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--accent-green);
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(34, 211, 160, 0.4); }
  50% { opacity: 0.8; box-shadow: 0 0 0 6px rgba(34, 211, 160, 0); }
}

.hero h1 {
  font-size: 2rem;
  font-weight: 800;
  letter-spacing: -1px;
  margin-bottom: 10px;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-green) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.hero .subtitle {
  font-size: 0.95rem;
  color: var(--text-dim);
  margin-bottom: 16px;
}

.hero .update-time {
  display: inline-block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.78rem;
  color: var(--accent-warm);
  background: rgba(255, 179, 71, 0.1);
  border: 1px solid rgba(255, 179, 71, 0.2);
  padding: 4px 14px;
  border-radius: 50px;
}

.stats {
  display: flex;
  justify-content: center;
  gap: 32px;
  margin-top: 24px;
  flex-wrap: wrap;
}

.stat { text-align: center; }
.stat-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--accent);
}
.stat-label {
  font-size: 0.72rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.back-link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--text-dim);
  font-size: 0.9rem;
  margin: 24px 0;
  padding: 8px 16px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 999px;
  text-decoration: none;
  transition: all 0.25s ease;
}
.back-link:hover {
  color: var(--accent);
  border-color: var(--border-hover);
}

.section {
  padding: 32px 0;
  margin: 56px 0;
}

.section-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.72rem;
  color: var(--accent);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.section-label::before { content: '## '; color: var(--text-faint); }
.section-title {
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--accent);
  margin: 0 0 28px;
  padding: 16px 20px;
  background: linear-gradient(135deg, rgba(0,212,255,0.1) 0%, rgba(20,28,48,0.5) 100%);
  border-left: 4px solid var(--accent);
  border-top: 1px solid rgba(0, 212, 255, 0.25);
  border-bottom: 1px solid rgba(0, 212, 255, 0.3);
  border-radius: 0 12px 12px 0;
  display: flex;
  align-items: center;
  gap: 10px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
}
.section-title .num {
  margin-left: auto;
  font-size: 0.72rem;
  color: var(--text-dim);
  background: rgba(0,212,255,0.1);
  padding: 3px 12px;
  border-radius: 50px;
  font-weight: 600;
  letter-spacing: 0.5px;
  border: 1px solid var(--border);
}

.report-list { display: flex; flex-direction: column; gap: 12px; }

.report-card {
  display: flex;
  align-items: center;
  text-decoration: none;
  color: inherit;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px 22px;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  backdrop-filter: blur(10px);
  position: relative;
  overflow: hidden;
  gap: 12px;
}

.report-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--accent-green));
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.4s ease;
}

.report-card:hover {
  border-color: var(--border-hover);
  transform: translateY(-2px);
  box-shadow: 0 8px 32px rgba(0, 212, 255, 0.08);
}
.report-card:hover::before {
  transform: scaleX(1);
}

.report-card.latest {
  border-color: rgba(0, 212, 255, 0.3);
  background: linear-gradient(135deg, rgba(0, 212, 255, 0.08) 0%, rgba(20, 28, 48, 0.6) 100%);
}

.card-info {
  flex: 1;
}

.card-date {
  font-family: 'JetBrains Mono', monospace;
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}

.latest-badge {
  font-size: 0.65rem;
  font-weight: 700;
  color: var(--accent-green);
  background: rgba(34, 211, 160, 0.15);
  border: 1px solid rgba(34, 211, 160, 0.3);
  padding: 2px 8px;
  border-radius: 4px;
  letter-spacing: 1px;
}

.card-weekday {
  font-size: 0.82rem;
  color: var(--text-faint);
  margin-top: 4px;
}

.card-link {
  font-size: 0.88rem;
  color: var(--accent);
  font-weight: 600;
  white-space: nowrap;
  margin-left: auto;
}

.comments-section {
  margin: 56px 0 32px;
  padding: 28px 24px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  position: relative;
}

.comments-section::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--accent-purple), var(--accent), var(--accent-green));
  border-radius: var(--radius) var(--radius) 0 0;
}

.comments-title {
  color: #a5b4fc;
  font-size: 1.2rem;
  font-weight: 700;
  margin-bottom: 8px;
  letter-spacing: 0.02em;
}

.comments-desc {
  color: var(--text-dim);
  font-size: 0.9rem;
  margin-bottom: 16px;
}

.giscus {
  margin-top: 16px;
}

footer, .footer {
  margin-top: 56px;
  padding: 28px 24px;
  text-align: center;
  color: var(--text-faint);
  font-size: 0.85rem;
  border-top: 1px solid var(--border);
  letter-spacing: 0.02em;
}

@media (max-width: 600px) {
  body { font-size: 14px; }
  .container { padding: 0 16px 40px; }
  .hero { padding: 40px 16px 30px; }
  .hero h1 { font-size: 1.5rem; }
  .stats { gap: 16px; }
  .stat-num { font-size: 1.3rem; }
  .section { margin: 40px 0; }
  .section-title { font-size: 1.15rem; padding: 12px 16px; }
  .report-card { padding: 16px; }
  .card-date { font-size: 1rem; }
  .comments-section { padding: 20px 16px; margin: 40px 0 24px; }
}
</style>
</head>
