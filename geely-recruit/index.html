<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>吉利招聘日报 - 报告汇总</title>
<style>
/* ============================================================
   报告页统一CSS模板 - v6.0 暗色主题版
   v6.0改进:
   - 标题层级色彩区分: h2青色/h3紫色/h4琥珀色
   - 板块间距增大至56px, 相邻板块更清晰
   - 表格暗色主题优化, 渐变表头+交替行色
   - 卡片悬停效果增强, 平滑过渡动画
   - 内容类型色彩编码: 左边框颜色区分信息类型
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');

/* ============================================================
   1. CSS 变量 (Color Variables)
   ============================================================ */
:root {
  --bg: #0a0e1a;
  --bg-elev: #111726;
  --card: rgba(20, 28, 48, 0.6);
  --card-solid: rgba(20, 28, 48, 0.75);
  --card-hover: rgba(20, 28, 48, 0.85);
  --border: rgba(0, 212, 255, 0.12);
  --border-hover: rgba(0, 212, 255, 0.4);
  --text: #f0f4f8;
  --text-dim: #a8b8d0;
  --text-faint: #7888a8;
  --accent: #00d4ff;
  --accent-warm: #ffb347;
  --accent-green: #22d3a0;
  --accent-purple: #818cf8;
  --accent-pink: #f87171;
  --accent-teal: #14b8a6;
  --accent-orange: #fb923c;
  --grid-line: rgba(0, 212, 255, 0.04);
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 20px rgba(0,0,0,0.4);
  --shadow-lg: 0 12px 48px rgba(0,0,0,0.5);
  --radius: 16px;
  --radius-sm: 10px;
}

/* ============================================================
   2. Base Reset + Body Styles
   ============================================================ */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 15px;
  line-height: 1.8;
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
  letter-spacing: 0.01em;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

::selection {
  background: rgba(0, 212, 255, 0.25);
  color: #ffffff;
}

/* ============================================================
   3. Paragraph, Strong, Links, Lists
   ============================================================ */
p {
  margin-bottom: 12px;
  color: var(--text-dim);
  line-height: 1.8;
}

p:last-child {
  margin-bottom: 0;
}

strong, b {
  color: var(--accent);
  font-weight: 600;
}

a {
  color: var(--accent);
  text-decoration: none;
  transition: color 0.2s ease, opacity 0.2s ease;
}

a:hover {
  color: #5ee5ff;
  text-decoration: underline;
  text-underline-offset: 2px;
}

ul, ol {
  margin: 12px 0;
  padding-left: 22px;
  color: var(--text-dim);
}

li {
  margin-bottom: 6px;
  line-height: 1.8;
}

li::marker {
  color: var(--accent);
}

em, i {
  color: var(--text);
  font-style: italic;
}

small {
  color: var(--text-faint);
  font-size: 0.85em;
}

/* ============================================================
   4. Decorative Grid Background + Floating Orb
   ============================================================ */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 48px 48px;
  pointer-events: none;
  z-index: 0;
  opacity: 0.6;
}

body::after {
  content: '';
  position: fixed;
  top: -20%;
  right: -10%;
  width: 600px;
  height: 600px;
  background: radial-gradient(circle, rgba(0, 212, 255, 0.08) 0%, transparent 70%);
  border-radius: 50%;
  pointer-events: none;
  z-index: 0;
  filter: blur(40px);
  animation: floatOrb 18s ease-in-out infinite;
}

@keyframes floatOrb {
  0%, 100% { transform: translate(0, 0); opacity: 0.6; }
  50% { transform: translate(-40px, 30px); opacity: 0.9; }
}

/* ============================================================
   5. Container
   ============================================================ */
.container {
  max-width: 960px;
  margin: 0 auto;
  padding: 40px 28px 80px;
  position: relative;
  z-index: 1;
}

.container-wide {
  max-width: 1100px;
}

.container-narrow {
  max-width: 760px;
}

/* ============================================================
   6. Header (Gradient Title Bar)
   ============================================================ */
.report-header {
  background: linear-gradient(135deg, rgba(0, 212, 255, 0.10) 0%, rgba(129, 140, 248, 0.10) 50%, rgba(34, 211, 160, 0.08) 100%);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 40px 36px;
  margin-bottom: 48px;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow-md);
}

.report-header::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--accent), var(--accent-purple), var(--accent-green));
}

.report-header h1 {
  color: #ffffff;
  font-size: 1.8rem;
  font-weight: 700;
  text-align: center;
  letter-spacing: 0.02em;
  margin-bottom: 12px;
  text-shadow: 0 0 24px rgba(0, 212, 255, 0.45), 0 0 48px rgba(0, 212, 255, 0.2);
  line-height: 1.3;
}

.report-header .subtitle {
  color: var(--text-dim);
  font-size: 1rem;
  text-align: center;
  font-weight: 400;
  margin-bottom: 20px;
  letter-spacing: 0.03em;
}

.report-header .date-badge {
  display: inline-block;
  background: rgba(0, 212, 255, 0.12);
  border: 1px solid rgba(0, 212, 255, 0.35);
  color: var(--accent);
  padding: 6px 18px;
  border-radius: 999px;
  font-size: 0.88rem;
  font-weight: 500;
  letter-spacing: 0.04em;
  font-family: 'JetBrains Mono', monospace;
}

.report-header .meta {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 16px;
  margin-top: 20px;
  font-size: 0.85rem;
  color: var(--text-faint);
}

.report-header .meta span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.report-header .header-center {
  text-align: center;
}

/* ============================================================
   7. Back Links + Nav Links + Nav TOC
   ============================================================ */
.back-link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--text-dim);
  font-size: 0.9rem;
  margin-bottom: 24px;
  padding: 8px 16px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 999px;
  transition: all 0.25s ease;
}

.back-link:hover {
  color: var(--accent);
  border-color: var(--border-hover);
  background: var(--card-hover);
  text-decoration: none;
}

.nav-links {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin: 24px 0 40px;
  padding: 14px 18px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
}

.nav-links a {
  display: inline-block;
  padding: 6px 14px;
  font-size: 0.85rem;
  color: var(--text-dim);
  background: rgba(0, 212, 255, 0.06);
  border: 1px solid var(--border);
  border-radius: 999px;
  transition: all 0.2s ease;
}

.nav-links a:hover {
  color: var(--accent);
  background: rgba(0, 212, 255, 0.14);
  border-color: var(--border-hover);
  text-decoration: none;
}

.nav-toc {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 20px 24px;
  margin: 0 0 48px;
}

.nav-toc .toc-title {
  color: var(--accent);
  font-size: 1rem;
  font-weight: 600;
  margin-bottom: 12px;
  letter-spacing: 0.03em;
}

.nav-toc ol, .nav-toc ul {
  list-style: none;
  padding-left: 0;
  margin: 0;
}

.nav-toc li {
  padding: 4px 0;
}

.nav-toc a {
  color: var(--text-dim);
  font-size: 0.9rem;
  transition: color 0.2s ease;
}

.nav-toc a:hover {
  color: var(--accent);
  text-decoration: none;
}

/* ============================================================
   8. Section Titles (h2 / .section-title) — KEY IMPROVEMENT
   ============================================================ */
h2, .section-title {
  color: #00d4ff;
  font-size: 1.4rem;
  font-weight: 700;
  margin: 0 0 24px;
  padding: 12px 18px 12px 16px;
  background: linear-gradient(90deg, rgba(0, 212, 255, 0.14) 0%, rgba(0, 212, 255, 0.02) 100%);
  border-left: 4px solid var(--accent);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  letter-spacing: 0.03em;
  display: flex;
  align-items: center;
  gap: 10px;
  position: relative;
}

h2::before, .section-title::before {
  /* icon / emoji spacer kept flexible via content from HTML */
  font-size: 1.2rem;
  line-height: 1;
}

h2 .num-badge, .section-title .num-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 28px;
  height: 28px;
  padding: 0 8px;
  background: linear-gradient(135deg, var(--accent), var(--accent-purple));
  color: #0a0e1a;
  font-size: 0.85rem;
  font-weight: 700;
  border-radius: 999px;
  font-family: 'JetBrains Mono', monospace;
  flex-shrink: 0;
}

.section-title a, h2 a {
  color: inherit;
}

.section-title a:hover {
  color: #5ee5ff;
  text-decoration: none;
}

/* ============================================================
   9. Sections (.section) — with top gradient bar
   ============================================================ */
.section {
  margin: 56px 0;
  position: relative;
  padding: 0;
  scroll-margin-top: 24px;
}

.section::before {
  content: '';
  position: absolute;
  top: -8px;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--accent) 0%, var(--accent-purple) 50%, var(--accent-green) 100%);
  border-radius: 999px;
  opacity: 0.85;
}

.section:first-of-type {
  margin-top: 0;
}

.section:first-of-type::before {
  display: none;
}

.section > h2:first-child,
.section > .section-title:first-child {
  margin-top: 0;
}

/* ============================================================
   10. H3 Sub-titles — purple color (KEY CHANGE)
   ============================================================ */
h3 {
  color: #a5b4fc;
  font-size: 1.1rem;
  font-weight: 600;
  margin: 32px 0 14px;
  padding: 6px 0 6px 12px;
  border-left: 3px solid #818cf8;
  letter-spacing: 0.02em;
  line-height: 1.4;
}

h3:first-child {
  margin-top: 0;
}

h3 a {
  color: inherit;
}

h3 a:hover {
  color: #c7d0ff;
  text-decoration: none;
}

/* ============================================================
   11. H4 Minor Headings — amber color (KEY CHANGE)
   ============================================================ */
h4 {
  color: #fbbf24;
  font-size: 0.95rem;
  font-weight: 700;
  margin: 22px 0 10px;
  letter-spacing: 0.02em;
  line-height: 1.4;
  border: none;
}

h4:first-child {
  margin-top: 0;
}

h4 a {
  color: inherit;
}

h4 a:hover {
  color: #fcd34d;
  text-decoration: none;
}

/* Fallback for h5/h6 */
h5 {
  color: var(--text);
  font-size: 0.9rem;
  font-weight: 600;
  margin: 16px 0 8px;
}

h6 {
  color: var(--text-dim);
  font-size: 0.85rem;
  font-weight: 600;
  margin: 14px 0 8px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

/* ============================================================
   12. Cards (.card)
   ============================================================ */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-left: 4px solid var(--accent);
  border-radius: var(--radius-sm);
  padding: 18px 20px;
  margin: 14px 0;
  box-shadow: var(--shadow-sm);
  transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease, background 0.25s ease;
}

.card:hover {
  transform: translateY(-2px);
  background: var(--card-hover);
  border-color: var(--border-hover);
  border-left-color: var(--accent);
  box-shadow: var(--shadow-md);
}

.card-title {
  color: var(--accent);
  font-size: 1.05rem;
  font-weight: 600;
  margin-bottom: 8px;
  letter-spacing: 0.02em;
}

.card-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  font-size: 0.82rem;
  color: var(--text-faint);
  margin-bottom: 10px;
  font-family: 'JetBrains Mono', monospace;
}

.card-content {
  color: var(--text-dim);
  font-size: 0.92rem;
  line-height: 1.8;
}

.card-content p {
  margin-bottom: 8px;
}

/* ============================================================
   13. Job Cards (.job-card)
   ============================================================ */
.job-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-left: 4px solid var(--accent-green);
  border-radius: var(--radius-sm);
  padding: 18px 20px;
  margin: 14px 0;
  box-shadow: var(--shadow-sm);
  transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease, background 0.25s ease;
}

.job-card:hover {
  transform: translateY(-2px);
  background: var(--card-hover);
  border-color: rgba(34, 211, 160, 0.4);
  border-left-color: var(--accent-green);
  box-shadow: var(--shadow-md);
}

.job-card .job-title {
  color: var(--accent-green);
  font-size: 1.05rem;
  font-weight: 600;
  margin-bottom: 8px;
  letter-spacing: 0.02em;
}

.job-card .job-title a {
  color: inherit;
}

.job-card .job-title a:hover {
  color: #4ee9b8;
  text-decoration: none;
}

.job-card .job-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  font-size: 0.82rem;
  color: var(--text-faint);
  margin-bottom: 10px;
  font-family: 'JetBrains Mono', monospace;
}

.job-card .job-meta span {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.job-card .job-desc {
  color: var(--text-dim);
  font-size: 0.92rem;
  line-height: 1.8;
}

/* ============================================================
   14. News Items (.news-item)
   ============================================================ */
.news-item {
  background: rgba(0, 212, 255, 0.05);
  border: 1px solid var(--border);
  border-left: 4px solid var(--accent);
  border-radius: var(--radius-sm);
  padding: 16px 20px;
  margin: 12px 0;
  transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease, background 0.25s ease;
}

.news-item:hover {
  transform: translateY(-2px);
  background: rgba(0, 212, 255, 0.09);
  border-color: var(--border-hover);
  border-left-color: var(--accent);
  box-shadow: var(--shadow-sm);
}

.news-item .news-title {
  color: var(--accent);
  font-size: 1rem;
  font-weight: 600;
  margin-bottom: 6px;
}

.news-item .news-title a {
  color: inherit;
}

.news-item .news-title a:hover {
  color: #5ee5ff;
  text-decoration: none;
}

.news-item .news-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  font-size: 0.8rem;
  color: var(--text-faint);
  margin-bottom: 8px;
  font-family: 'JetBrains Mono', monospace;
}

.news-item .news-desc {
  color: var(--text-dim);
  font-size: 0.92rem;
  line-height: 1.8;
}

.news-item .badge,
.news-item .tag {
  margin-right: 6px;
}

/* ============================================================
   15. Tables
   ============================================================ */
.table-wrap {
  overflow-x: auto;
  margin: 20px 0;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  -webkit-overflow-scrolling: touch;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.9rem;
  overflow: hidden;
}

table thead tr:first-child th:first-child {
  border-top-left-radius: var(--radius-sm);
}

table thead tr:first-child th:last-child {
  border-top-right-radius: var(--radius-sm);
}

table tbody tr:last-child td:first-child {
  border-bottom-left-radius: var(--radius-sm);
}

table tbody tr:last-child td:last-child {
  border-bottom-right-radius: var(--radius-sm);
}

th {
  background: linear-gradient(135deg, rgba(0, 212, 255, 0.18) 0%, rgba(0, 212, 255, 0.08) 100%);
  color: var(--accent);
  font-weight: 700;
  text-align: left;
  padding: 12px 14px;
  border-bottom: 2px solid rgba(0, 212, 255, 0.3);
  letter-spacing: 0.03em;
  white-space: nowrap;
}

td {
  padding: 12px 14px;
  color: var(--text-dim);
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}

table tbody tr:nth-child(odd) td {
  background: rgba(0, 212, 255, 0.04);
}

table tbody tr:nth-child(even) td {
  background: rgba(0, 212, 255, 0.08);
}

table tbody tr {
  transition: background 0.2s ease;
}

table tbody tr:hover td {
  background: rgba(0, 212, 255, 0.16);
  color: var(--text);
}

table tbody tr:last-child td {
  border-bottom: none;
}

/* Salary table */
.salary-table th {
  background: linear-gradient(135deg, rgba(34, 211, 160, 0.18) 0%, rgba(34, 211, 160, 0.08) 100%);
  color: var(--accent-green);
  border-bottom-color: rgba(34, 211, 160, 0.3);
}

.salary-table td strong {
  color: var(--accent-green);
}

/* Summary table */
.summary-table th {
  background: linear-gradient(135deg, rgba(129, 140, 248, 0.18) 0%, rgba(129, 140, 248, 0.08) 100%);
  color: #a5b4fc;
  border-bottom-color: rgba(129, 140, 248, 0.3);
}

.summary-table td:first-child {
  color: var(--text);
  font-weight: 500;
}

/* ============================================================
   16. Badges
   ============================================================ */
.badge {
  display: inline-block;
  padding: 3px 10px;
  font-size: 0.78rem;
  font-weight: 600;
  border-radius: 999px;
  background: rgba(0, 212, 255, 0.12);
  color: var(--accent);
  border: 1px solid rgba(0, 212, 255, 0.3);
  letter-spacing: 0.03em;
  line-height: 1.5;
  vertical-align: middle;
}

.badge-high {
  background: rgba(248, 113, 113, 0.14);
  color: var(--accent-pink);
  border-color: rgba(248, 113, 113, 0.4);
}

.badge-mid {
  background: rgba(251, 146, 60, 0.14);
  color: var(--accent-orange);
  border-color: rgba(251, 146, 60, 0.4);
}

.badge-low {
  background: rgba(34, 211, 160, 0.14);
  color: var(--accent-green);
  border-color: rgba(34, 211, 160, 0.4);
}

.badge-hot {
  background: linear-gradient(135deg, rgba(248, 113, 113, 0.2), rgba(251, 146, 60, 0.2));
  color: #fca5a5;
  border-color: rgba(248, 113, 113, 0.5);
}

.badge-new {
  background: rgba(34, 211, 160, 0.18);
  color: var(--accent-green);
  border-color: rgba(34, 211, 160, 0.45);
}

.badge-warn {
  background: rgba(251, 191, 36, 0.16);
  color: #fbbf24;
  border-color: rgba(251, 191, 36, 0.4);
}

.badge-info {
  background: rgba(0, 212, 255, 0.12);
  color: var(--accent);
  border-color: rgba(0, 212, 255, 0.3);
}

.badge-purple {
  background: rgba(129, 140, 248, 0.14);
  color: #a5b4fc;
  border-color: rgba(129, 140, 248, 0.4);
}

/* ============================================================
   17. Tags
   ============================================================ */
.tag {
  display: inline-block;
  padding: 3px 10px;
  font-size: 0.78rem;
  font-weight: 500;
  border-radius: 4px;
  background: rgba(168, 184, 208, 0.1);
  color: var(--text-dim);
  border: 1px solid var(--border);
  margin: 0 4px 4px 0;
  letter-spacing: 0.02em;
  line-height: 1.5;
  vertical-align: middle;
}

.tag-accent {
  background: rgba(0, 212, 255, 0.12);
  color: var(--accent);
  border-color: rgba(0, 212, 255, 0.3);
}

.tag-green {
  background: rgba(34, 211, 160, 0.12);
  color: var(--accent-green);
  border-color: rgba(34, 211, 160, 0.3);
}

.tag-purple {
  background: rgba(129, 140, 248, 0.12);
  color: #a5b4fc;
  border-color: rgba(129, 140, 248, 0.3);
}

.tag-orange {
  background: rgba(251, 146, 60, 0.12);
  color: var(--accent-orange);
  border-color: rgba(251, 146, 60, 0.3);
}

.tag-pink {
  background: rgba(248, 113, 113, 0.12);
  color: var(--accent-pink);
  border-color: rgba(248, 113, 113, 0.3);
}

.tag-teal {
  background: rgba(20, 184, 166, 0.12);
