<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<script src="/guard.js" charset="utf-8"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全站搜索 | TS-dinglilu 自动化日报</title>
<meta property="og:image" content="https://ts-dinglilu.github.io/assets/cover.png">
<meta property="og:url" content="https://ts-dinglilu.github.io/search.html">
<meta name="description" content="一站式检索 800+ 期日报：车企招聘、机械岗位、地区动态、科研进展、校园资讯。">
<meta name="theme-color" content="#0a0e1a">
<link rel="canonical" href="https://ts-dinglilu.github.io/search.html">
<link rel="manifest" href="/manifest.webmanifest">
<style>
:root{--bg:#0a0e1a;--bg-elev:#111726;--card:rgba(20,28,48,.75);--border:rgba(0,212,255,.22);
--accent:#00d4ff;--text:#f0f4f8;--sub:#90a0c0;--radius:14px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,
"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px 60px}
.wrap{width:min(860px,100%)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}
.top a{color:var(--sub);text-decoration:none;font-size:.9rem}
.top a:hover{color:var(--accent)}
h1{font-size:1.5rem;margin:0 0 4px}
h1 span{color:var(--accent)}
.lead{color:var(--sub);font-size:.86rem;margin:0 0 22px}
.search-box{display:flex;gap:10px;margin-bottom:16px}
.search-box input{flex:1;background:var(--bg-elev);border:1px solid var(--border);color:var(--text);
border-radius:var(--radius);padding:15px 18px;font-size:1.05rem;outline:none}
.search-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,212,255,.15)}
.search-box button{background:linear-gradient(135deg,#00d4ff,#818cf8);border:none;color:#0a0e1a;
font-weight:700;font-size:1rem;border-radius:var(--radius);padding:0 26px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.chip{background:var(--bg-elev);border:1px solid var(--border);color:var(--sub);font-size:.8rem;
border-radius:999px;padding:6px 14px;cursor:pointer;user-select:none}
.chip.on{background:rgba(0,212,255,.14);border-color:var(--accent);color:var(--accent);font-weight:600}
.meta{color:var(--sub);font-size:.82rem;margin-bottom:14px;min-height:1.2em}
.result{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
padding:16px 18px;margin-bottom:12px;display:block;text-decoration:none;color:var(--text);
transition:transform .15s ease,border-color .15s ease}
.result:hover{transform:translateY(-2px);border-color:var(--accent)}
.r-head{display:flex;gap:10px;align-items:center;font-size:.78rem;color:var(--sub);margin-bottom:8px;flex-wrap:wrap}
.r-cat{background:rgba(0,212,255,.12);color:var(--accent);border-radius:6px;padding:2px 8px}
.r-title{font-size:1.02rem;font-weight:600;margin-bottom:6px;line-height:1.45}
.r-sum{color:var(--sub);font-size:.86rem;line-height:1.65;display:-webkit-box;-webkit-line-clamp:2;
-webkit-box-orient:vertical;overflow:hidden}
mark{background:rgba(0,212,255,.25);color:var(--accent);border-radius:3px;padding:0 2px}
.pager{display:flex;gap:8px;justify-content:center;margin-top:26px;flex-wrap:wrap}
.pager button{background:var(--bg-elev);border:1px solid var(--border);color:var(--sub);
border-radius:8px;padding:8px 14px;cursor:pointer;font-size:.85rem}
.pager button.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.empty{text-align:center;color:var(--sub);padding:60px 0;font-size:.95rem}
.status{color:var(--sub);font-size:.88rem;text-align:center;padding:50px 0}
.status .spin{display:inline-block;width:18px;height:18px;border:2px solid var(--border);
border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-4px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.kbd-hint{color:var(--sub);font-size:.78rem;margin-top:10px}
.kbd-hint kbd{background:var(--bg-elev);border:1px solid var(--border);border-radius:4px;padding:1px 6px;font-size:.75rem}
@media (max-width:600px){.search-box button{padding:0 16px}h1{font-size:1.25rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<script type="application/ld+json">
{"@context": "https://schema.org", "@type": "CollectionPage", "name": "", "url": "https://ts-dinglilu.github.io/search.html", "inLanguage": "zh-CN", "isPartOf": {"@type": "WebSite", "name": "TS-dinglilu 自动化日报", "url": "https://ts-dinglilu.github.io/"}}
</script>
<!-- optimize_site:head -->
</head>
<body>
<div class="wrap">
  <div class="top">
    <a href="/">← 返回主页</a>
    <a href="/digest/" target="_blank">周记·月记·年记</a>
  </div>
  <h1>全站搜索 <span>· 800+ 期日报</span></h1>
  <p class="lead">覆盖 34 个分类的全部历史报告：车企 / 机械 / 地区 / 校园 / 科研 / 口碑。支持多关键词、分类筛选与日期。</p>

  <div class="search-box">
    <input id="q" type="search" placeholder="例如：比亚迪 薪资 ／ 徐工 招聘 ／ 2026-10-15" autocomplete="off">
    <button id="go" type="button">搜索</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="meta" id="meta"></div>
  <div id="results"><div class="status"><span class="spin"></span>正在加载搜索索引（约 270 KB，仅首次）…</div></div>
  <div class="pager" id="pager"></div>
  <div class="kbd-hint">小提示：按 <kbd>Enter</kbd> 搜索，<kbd>Esc</kbd> 清空重输。</div>
</div>

<script>
(function(){
'use strict';
var PAGE=30, idx=null, cat='all', page=1;
var $q=document.getElementById('q'), $go=document.getElementById('go'),
    $chips=document.getElementById('chips'), $meta=document.getElementById('meta'),
    $res=document.getElementById('results'), $pg=document.getElementById('pager');

function esc(s){return s.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function hl(text,terms){
  var out=esc(text);
  terms.forEach(function(t){
    if(!t) return;
    out=out.replace(new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),
      function(m){return '<mark>'+m+'</mark>';});
  });
  return out;
}
function tokenize(q){
  return q.trim().toLowerCase().split(/\s+/).filter(Boolean);
}
function hit(it,terms){
  // 拼接可检索字段：分类中文名 + 日期 + 板块 + 条目 + 摘要
  var hay=(it.cn+' '+it.d+' '+(it.sec||[]).join(' ')+' '+(it.t||[]).join(' ')+' '+it.s).toLowerCase();
  return terms.every(function(t){return hay.indexOf(t)>=0;});
}
function score(it,terms){
  // 命中位置越靠前越相关：条目标题 > 板块 > 摘要
  var blob=((it.t||[]).join(' ')+' '+(it.sec||[]).join(' ')+' '+it.s).toLowerCase();
  var s=0;
  terms.forEach(function(t){
    var p=blob.indexOf(t);
    if(p>=0) s+=(p<120?4:2);
  });
  return s+Math.min(2,terms.length);
}
function render(){
  var terms=tokenize($q.value);
  var pool=idx.items.filter(function(it){return cat==='all'||it.c===cat;});
  var list=terms.length?pool.filter(function(it){return hit(it,terms);}):pool;
  if(terms.length){
    list=list.map(function(it){return[it,score(it,terms)];})
             .sort(function(a,b){return b[1]-a[1];})
             .map(function(x){return x[0];});
  }
  var pages=Math.max(1,Math.ceil(list.length/PAGE));
  if(page>pages)page=pages;
  var slice=list.slice((page-1)*PAGE,page*PAGE);

  $meta.textContent=list.length?('共 '+list.length+' 条'+(terms.length?' · 按相关度排序':'')+' · 第 '+page+'/'+pages+' 页'):'';
  if(!slice.length){
    $res.innerHTML='<div class="empty">'+(terms.length?'没有找到「'+esc($q.value)+'」相关的内容。<br>换个关键词试试，比如公司名、城市名或日期（2026-10-15）。':'索引为空。')+'</div>';
    $pg.innerHTML='';return;
  }
  $res.innerHTML=slice.map(function(it){
    var topics=(it.t||[]).slice(0,3).map(function(t){return hl(t,terms);}).filter(Boolean).join(' ／ ');
    return '<a class="result" href="'+it.u+'" target="_blank">'
      +'<div class="r-head"><span class="r-cat">'+esc(it.cn)+'</span><span>'+esc(it.d)+'</span></div>'
      +'<div class="r-title">'+hl(it.cn+' · '+it.d,terms)+'</div>'
      +(topics?'<div class="r-sum">'+topics+'</div>':'')
      +'<div class="r-sum">'+hl(it.s,terms)+'</div>'
      +'</a>';
  }).join('');
  // 分页
  var btns='';
  function btn(n,label,on){return '<button data-p="'+n+'" class="'+(on?'on':'')+'">'+label+'</button>';}
  if(pages>1){
    if(page>1)btns+=btn(page-1,'← 上一页');
    var st=Math.max(1,page-2),en=Math.min(pages,st+4);
    for(var i=st;i<=en;i++)btns+=btn(i,i,i===page);
    if(page<pages)btns+=btn(page+1,'下一页 →');
  }
  $pg.innerHTML=btns;
  $pg.querySelectorAll('button').forEach(function(b){
    b.addEventListener('click',function(){page=+b.dataset.p;render();window.scrollTo(0,0);});
  });
}
function buildChips(){
  var seen={},names={};
  idx.items.forEach(function(it){seen[it.c]=1;names[it.c]=it.cn;});
  var cats=Object.keys(seen).sort();
  var html='<span class="chip on" data-c="all">全部</span>'+cats.map(function(c){
    return '<span class="chip" data-c="'+esc(c)+'">'+esc(names[c])+'</span>';}).join('');
  $chips.innerHTML=html;
  $chips.querySelectorAll('.chip').forEach(function(ch){
    ch.addEventListener('click',function(){
      cat=ch.dataset.c;page=1;
      $chips.querySelectorAll('.chip').forEach(function(x){x.classList.remove('on');});
      ch.classList.add('on');render();
    });
  });
}
function run(){page=1;render();
  if(history.replaceState)history.replaceState(null,'','?q='+encodeURIComponent($q.value));}
$go.addEventListener('click',run);
$q.addEventListener('keydown',function(e){if(e.key==='Enter')run();});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){$q.value='';page=1;render();$q.focus();}
});
fetch('/assets/search-index.json').then(function(r){return r.json();}).then(function(j){
  idx=j;
  buildChips();
  var pre=new URLSearchParams(location.search).get('q');
  if(pre){$q.value=pre;}
  render();
  $q.focus();
}).catch(function(){
  $res.innerHTML='<div class="empty">索引加载失败，请刷新重试。</div>';
});
})();
</script>
</body>
</html>
